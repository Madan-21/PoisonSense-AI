<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PoisonSense AI</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-body">
  <div class="auth-container">

    <!-- Logo / Header -->
    <div class="auth-header">
      <img src="../images/logo.jpg" alt="PoisonSense AI">
      <h2>PoisonSense AI</h2>
      <h3>Welcome Back</h3>
      <p>Sign in to access emergency support</p>
    </div>

    <!-- Login Form -->
    <form class="auth-form">

      <label>Email Address</label>
      <div class="input-box">
        <input type="email" placeholder="your.email@example.com" required>
      </div>

      <label>Password</label>
      <div class="input-box">
        <input type="password" placeholder="Enter your password" required>
      </div>

      <div class="auth-row">
        <label class="remember">
          <input type="checkbox">
          <span>Remember me</span>
        </label>

        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-primary">➡️ Sign In</button>

      <div class="divider">Or continue with</div>

      <div class="social-buttons">
        <button type="button" class="btn-social google">G Google</button>
        <button type="button" class="btn-social facebook">f Facebook</button>
      </div>

      <div class="auth-footer-text">
        Don’t have an account? <a href="signup.html">Sign Up</a>
      </div>

    </form>

    <!-- Emergency Box -->
    <div class="emergency-box">
      <h4>⚠ Emergency Situation?</h4>
      <p>You can access emergency features without logging in.</p>
      <a href="#" class="btn-emergency">Get Emergency Help Now</a>
    </div>

  </div>

</body>
</html>
